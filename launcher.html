<!-- 개발 테스트 환경 -->
<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #05060f;
				touch-action: none;
			}

			body {
				position: fixed;
				inset: 0;
			}

			canvas {
				display: block;
				width: 100vw;
				height: 100vh;
				height: 100dvh;
				/* 세로 전용 게임이라 가로가 세로보다 길면(1:1 을 넘으면) 가로를 세로 길이까지만 쓰고 가운데에 둔다. (양옆은 바탕색 레터박스)
				   엔진이 캔버스에 넣는 인라인 width 보다 max-width 가 앞서고, 엔진은 캔버스 크기와 위치로 뷰와 입력 좌표를 잡는다. */
				max-width: 100vh;
				max-width: 100dvh;
				margin: 0 auto;
			}
		</style>
		<script type="module" src="./launcher.js"></script>
	</head>
	<body>
	</body>
</html>
